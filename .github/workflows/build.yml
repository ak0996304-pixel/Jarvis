name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q -o Jarvis.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Download Vosk model
        working-directory: Jarvis
        run: |
          curl -L -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q m.zip
          rm -rf app/src/main/assets/model
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model
          uuidgen > app/src/main/assets/model/uuid
      - name: Build
        working-directory: Jarvis
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: Jarvis/app/build/outputs/apk/debug/app-debug.apk
